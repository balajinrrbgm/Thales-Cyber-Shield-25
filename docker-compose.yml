version: '3.8'

services:
  # Main application
  thales-cyber-shield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thales-cyber-shield
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - DATABASE_URL=postgresql://thales_user:thales_password@postgres:5432/thales_cyber_shield
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./models:/app/models
      - ./config:/app/config
    networks:
      - thales-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: thales-postgres
    environment:
      POSTGRES_DB: thales_cyber_shield
      POSTGRES_USER: thales_user
      POSTGRES_PASSWORD: thales_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - thales-network

  # Redis cache and message broker
  redis:
    image: redis:7-alpine
    container_name: thales-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - thales-network

  # Frontend dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: thales-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - thales-cyber-shield
    networks:
      - thales-network

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: thales-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - thales-network

  # Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: thales-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=thales123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./deployment/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - thales-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  thales-network:
    driver: bridge
