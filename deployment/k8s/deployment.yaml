apiVersion: apps/v1
kind: Deployment
metadata:
  name: thales-cyber-shield
  namespace: thales-cyber-shield
  labels:
    app: thales-cyber-shield
spec:
  replicas: 3
  selector:
    matchLabels:
      app: thales-cyber-shield
  template:
    metadata:
      labels:
        app: thales-cyber-shield
    spec:
      containers:
      - name: thales-cyber-shield
        image: thales/cyber-shield:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: thales-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: thales-secrets
              key: secret-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: thales-cyber-shield-service
  namespace: thales-cyber-shield
spec:
  selector:
    app: thales-cyber-shield
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
